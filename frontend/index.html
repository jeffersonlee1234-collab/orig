<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/samples/Government%20Service%20Integrity%20Seal.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Social Service Management</title>
    <script>
      window.addEventListener('error', function(e) {
        if (e && ((e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('MIME type'))) || (e.target && e.target.tagName === 'SCRIPT'))) {
          if (!sessionStorage.getItem('__auto_reloaded_for_chunk')) {
            sessionStorage.setItem('__auto_reloaded_for_chunk', 'true');
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
